[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vallen-cli"
version = "0.2.0"
description = "VALLEN CLI — AI Software Engineering Agent for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VALLEN" }]
keywords = ["ai", "cli", "tui", "coding-agent", "terminal"]

dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "toml>=0.10.2",
    "pygments>=2.17.0",
    "aiofiles>=23.2.1",
    "click>=8.1.7",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vallencli = "vallen_cli.__main__:main"
vallennext = "vallen_cli.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vallen_cli*", "vallen_ide*", "vallen_cihuy*"]

[tool.setuptools.package-data]
"vallen_cli" = ["*.tcss", "tui/*.tcss", "tui/widgets/*.tcss", "tui/banner.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
